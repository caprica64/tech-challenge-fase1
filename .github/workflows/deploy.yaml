name: Deploy

on:
  push:
    branches: [ dev ]

permissions:
  id-token: write  # required for OIDC JWT
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_URI: 861211186414.dkr.ecr.us-east-1.amazonaws.com/churn-dev

jobs:
  # ── 1. Verify AWS credentials ─────────────────────────────────────────────
  aws-connect:
    name: Verify AWS Connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861211186414:role/FIAP-Desafio1
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify authentication
        run: aws sts get-caller-identity

  # ── 2. Build Docker image ─────────────────────────────────────────────────
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: aws-connect

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            ${{ env.ECR_URI }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/image.tar
          retention-days: 1

  # ── 3. Publish image to ECR ───────────────────────────────────────────────
  publish:
    name: Publish to ECR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861211186414:role/FIAP-Desafio1
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load image from artifact
        run: docker load --input /tmp/image.tar

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_URI }}:${{ needs.build.outputs.image_tag }}
          docker push ${{ env.ECR_URI }}:latest

      - name: Summary
        run: |
          echo "### Image published to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_URI }}:${{ needs.build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_URI }}:latest\`" >> $GITHUB_STEP_SUMMARY
