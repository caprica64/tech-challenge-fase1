[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "previsao-de-churn-california"
version = "2026.5.0a1"
description = "Modelo de previsão de churn para clientes de telecom — FIAP Tech Challenge Fase 1"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Rodrigo Monteiro", email = "monteiro8ro@gmail.com" },
]

maintainers = [
  { name = "Rodrigo Monteiro", email = "monteiro8ro@gmail.com" },
]

keywords = ["churn", "machine-learning", "telecom", "classification"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  # Data
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",          # read .xlsx files

  # ML
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12", # SMOTE / class balancing
  "scipy>=1.13",

  # Deep learning
  "torch>=2.3",

  # Experiment tracking
  "mlflow>=2.13",
  "joblib>=1.4",

  # API
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "mangum>=0.17",            # AWS Lambda / API Gateway adapter for FastAPI

  # Visualisation
  "matplotlib>=3.9",
  "seaborn>=0.13",

  # Explainability
  "shap>=0.45",

  # Data validation
  "pandera>=0.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",    # FastAPI test client
  "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/rodrigo-monteiro/tech-challenge-fase1"

# ── Setuptools ─────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linting + formatting) ────────────────────────────────────────────
[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["F401", "F811", "E402"]  # F401: unused imports, F811: redefinition of unused, E402: import not at top

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"
